name: Windows fresh install

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-start:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites, start the app, and verify Codex and SQLite
        shell: powershell
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}\kernradio-smoke
          CODEX_HOME: ${{ runner.temp }}\kernradio-codex
        run: |
          . .\install-windows.ps1 -PrepareOnly
          $uv = (Get-Command uv -ErrorAction Stop).Source
          $stdout = Join-Path $env:RUNNER_TEMP 'kernradio-app.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'kernradio-app.stderr.log'
          $process = Start-Process -FilePath $uv -ArgumentList @('run', 'main.py') -WorkingDirectory $PWD -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $connected = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($process.HasExited) {
                throw "Kern Radio exited during startup with code $($process.ExitCode)."
              }
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:5000/api/status' -TimeoutSec 3
                if ($status.connected -eq $true -and $status.authenticated -eq $false) {
                  $connected = $true
                  break
                }
              } catch {
              }
              Start-Sleep -Seconds 1
            }
            if (-not $connected) {
              Write-Host 'Kern Radio stdout:'
              if (Test-Path $stdout) { Get-Content $stdout }
              Write-Host 'Kern Radio stderr:'
              if (Test-Path $stderr) { Get-Content $stderr }
              $errorLog = Join-Path $env:XDG_CONFIG_HOME 'kernradio\logs\errors.log'
              Write-Host 'Kern Radio error log:'
              if (Test-Path $errorLog) { Get-Content $errorLog }
              throw 'Kern Radio did not connect to the Codex CLI app server within 90 seconds.'
            }
            $database = Join-Path $env:XDG_CONFIG_HOME 'kernradio\catalog.sqlite3'
            if (-not (Test-Path -LiteralPath $database -PathType Leaf)) {
              throw 'Kern Radio did not create its SQLite database on startup.'
            }

            $page = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5000/' -TimeoutSec 10
            $tokenMatch = [regex]::Match($page.Content, 'name="app-token" content="([^"]+)"')
            if (-not $tokenMatch.Success) {
              throw 'Kern Radio did not provide its local import request token.'
            }
            $fixturePath = Join-Path $PWD 'tests\fixtures\crucible_posts.txt'
            $fixture = [IO.File]::ReadAllText($fixturePath, [Text.Encoding]::UTF8)
            $payload = ConvertTo-Json -InputObject @{ text = $fixture } -Compress
            $body = [Text.Encoding]::UTF8.GetBytes($payload)
            $headers = @{ 'X-App-Token' = $tokenMatch.Groups[1].Value }
            $import = Invoke-RestMethod -Uri 'http://127.0.0.1:5000/api/import' -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $body -TimeoutSec 300
            if ($import.counts.added -ne 4 -or $import.counts.failed -ne 0) {
              throw "Windows import smoke failed: $($import.counts.added) added, $($import.counts.failed) failed."
            }
            $repeat = Invoke-RestMethod -Uri 'http://127.0.0.1:5000/api/import' -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body $body -TimeoutSec 300
            if ($repeat.counts.existing -ne 4 -or $repeat.counts.failed -ne 0) {
              throw 'Windows import retry did not recognize all four songs as existing.'
            }
            Write-Host 'PASS: Windows install, Codex connection, SQLite creation, live four-song import, and idempotent retry.'
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              $global:LASTEXITCODE = 0
            }
          }
